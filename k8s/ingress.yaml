apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meridian
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: api.meridian.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 80 } } }
    - host: orders.meridian.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend: { service: { name: orders, port: { number: 8003 } } }
