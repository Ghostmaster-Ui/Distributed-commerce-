services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: meridian, POSTGRES_PASSWORD: meridian, POSTGRES_DB: meridian }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      { test: ["CMD-SHELL", "pg_isready -U meridian"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  kafka:
    image: redpandadata/redpanda:v24.3.7
    command:
      [
        "redpanda",
        "start",
        "--overprovisioned",
        "--smp",
        "1",
        "--memory",
        "512M",
        "--reserve-memory",
        "0M",
        "--node-id",
        "0",
        "--check=false",
        "--kafka-addr",
        "0.0.0.0:9092",
        "--advertise-kafka-addr",
        "kafka:9092",
      ]
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      {
        test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"],
        interval: 5s,
        timeout: 5s,
        retries: 20,
      }

  catalog:
    build: ./services/catalog
    environment: { DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian }
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
          ],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }

  pricing:
    build: ./services/pricing
    environment: { REDIS_URL: redis://redis:6379 }
    ports: ["8001:8001"]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
          ],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }

  inventory:
    build: ./services/inventory
    environment:
      {
        DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian,
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092,
      }
    ports: ["8002:8002"]
    depends_on:
      {
        postgres: { condition: service_healthy },
        kafka: { condition: service_healthy },
        catalog: { condition: service_healthy },
      }
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
          ],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }

  payments:
    build: ./services/payments
    ports: ["8004:8004"]
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')",
          ],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }

  orders:
    build: ./services/orders
    environment:
      DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRICING_URL: http://pricing:8001
      INVENTORY_URL: http://inventory:8002
      PAYMENT_URL: http://payments:8004
    ports: ["8003:8003"]
    depends_on:
      {
        postgres: { condition: service_healthy },
        kafka: { condition: service_healthy },
        pricing: { condition: service_healthy },
        inventory: { condition: service_healthy },
        payments: { condition: service_healthy },
      }
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
          ],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }

  gateway:
    build: ./gateway
    environment:
      CATALOG_SERVICE_URL: http://catalog:8000
      ORDER_SERVICE_URL: http://orders:8003
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-change-before-deploy
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      {
        catalog: { condition: service_healthy },
        orders: { condition: service_healthy },
        redis: { condition: service_healthy },
      }

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [catalog, pricing, inventory, orders, payments]

  grafana:
    image: grafana/grafana:12.1.0
    environment: { GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: meridian }
    volumes: ["./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3002:3000"]
    depends_on: [prometheus]

volumes: { postgres-data: {}, redis-data: {} }
